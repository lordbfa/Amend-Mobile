# Kept small enough for an 8 GB laptop with Android Studio open.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle process instead of starting a second big JVM
# (that second JVM is what failed with "Could not reserve enough space for object heap").
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Don't run R8, lint and other heavy tasks all at once — keeps peak memory low on laptops.
org.gradle.workers.max=2
# App version, shared by the phone app and the watch app (the watch adds 1,000,000 to the code)
amend.versionCode=51
amend.versionName=4.3.0
