name: Voiceover
# Generates the narration for promo videos (run by hand; not part of the app build).
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script file in promo/ (without .json)"
        default: voiceover
# This one pushes the finished audio to a promo-voice-* branch, so it needs to write.
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Kokoro TTS
        run: |
          pip install kokoro-onnx==0.4.9 soundfile
          curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      # The typed input only ever reaches the shell as a variable, and must be a plain file name.
      - name: Speak
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          case "$SCRIPT" in *[!A-Za-z0-9_-]*|"") echo "script must be a plain name"; exit 1;; esac
          python promo/tts.py "promo/$SCRIPT.json" voice
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voiceover
          path: voice/*.wav
      - name: Publish to the promo-voice branch
        env:
          SCRIPT: ${{ inputs.script }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pub && cp voice/*.wav /tmp/pub/
          cd /tmp/pub && git init -q -b promo-voice && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "voiceover" \
            && git push -qf "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:promo-voice-$SCRIPT"
