name: Build amend APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to attach APKs to a release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # Private-repo runners have ~7 GB RAM; Session's Gradle settings need more.
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules || true
          df -h /

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # websiteQa = release-optimised build (R8, shrunk) signed with the repo's debug key,
      # so it installs without any secrets. websiteDebug is handy for testing.
      - name: Build debug APK
        run: >
          ./gradlew :app:assembleWebsiteDebug --stacktrace --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process

      - name: Build optimised (QA) APK
        run: >
          ./gradlew :app:assembleWebsiteQa --stacktrace --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process

      # Still publish the debug APK even if the optimised build fails
      - name: Collect APKs
        if: success() || failure()
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Upload APKs
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: amend-apks
          path: out/*.apk
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
