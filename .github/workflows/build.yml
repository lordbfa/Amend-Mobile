name: Build amend

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (crypto vectors, eco rules)
        run: ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee build-output.txt; exit ${PIPESTATUS[0]}

      - name: Check amend TURN service
        continue-on-error: true
        run: |
          code=$(curl -s -o ice.json -w "%{http_code}" -H "X-Amend-Key: amend-calls-v1" https://amend-turn.lordbfa.workers.dev/ice)
          n=$(grep -o '"turns\?:[^"]*"' ice.json | wc -l)
          if [ "$code" = "200" ] && [ "$n" -gt 0 ]; then
            echo "::notice title=TURN service::OK — $n Cloudflare TURN addresses with fresh credentials"
          else
            echo "::warning title=TURN service::HTTP $code — $(head -c 200 ice.json)"
          fi
          rm -f ice.json

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee -a build-output.txt; exit ${PIPESTATUS[0]}

      # Turn compiler and test errors into annotations so they're visible without opening logs
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|AssertionError|Exception" build-output.txt | head -60 | while IFS= read -r line; do
            echo "::error::${line//$'\n'/ }"
          done
          # lint "vital" findings that block a release build
          find app/build -name "lint-results-*.txt" -o -name "lint-results*.txt" 2>/dev/null | head -3 | while read -r f; do
            grep -E ": Error: " "$f" | head -20 | while IFS= read -r line; do echo "::error title=Lint::$line"; done
          done
          grep -E ": Error: " build-output.txt | head -20 | while IFS= read -r line; do echo "::error title=Lint::$line"; done

      - name: Live relay test (real network)
        continue-on-error: true
        run: |
          ./gradlew :app:testDebugUnitTest --tests "app.amend.messenger.LiveRelayTest" -Damend.liveRelays=true --rerun 2>&1 | tee relay-output.txt
          if [ -f app/build/relay-report.txt ]; then
            echo "::notice title=Relay test::$(sed -z 's/\n/%0A/g' app/build/relay-report.txt)"
          fi
          grep -E "FAILED|AssertionError" relay-output.txt | head -10 | while IFS= read -r l; do echo "::warning title=Relay test::$l"; done

      - name: Relay scan
        continue-on-error: true
        run: |
          ./gradlew :app:testDebugUnitTest --tests "app.amend.messenger.RelayScanTest" -Damend.relayScan=true --rerun 2>&1 | tail -5
          if [ -f app/build/relay-scan.txt ]; then
            echo "::notice title=Relay scan::$(sed -z 's/\n/%0A/g' app/build/relay-scan.txt)"
          fi

      - name: Blossom scan
        continue-on-error: true
        run: |
          ./gradlew :app:testDebugUnitTest --tests "app.amend.messenger.MediaTest" -Damend.blobScan=true --rerun 2>&1 | tail -5
          if [ -f app/build/blob-scan.txt ]; then
            echo "::notice title=Blossom scan::$(sed -z 's/\n/%0A/g' app/build/blob-scan.txt)"
          fi

      - name: Build Play Store bundle (unsigned)
        run: ./gradlew :app:bundleRelease -Pamend.unsigned=true --stacktrace 2>&1 | tail -20; exit ${PIPESTATUS[0]}

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/bundle/release/*.aab out/amend-release-unsigned.aab
          cp app/build/outputs/apk/release/*.apk out/amend-release.apk
          cp app/build/outputs/apk/debug/*.apk out/amend-debug.apk
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: amend-apk
          path: |
            out/*.apk
            out/*.aab

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
