name: Build amend

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Only the small "release" job below may write, and only for a tag.
permissions:
  contents: read

# Every action is pinned to an exact commit (the tag it was taken from is in the comment),
# so a moved or hijacked tag can't change what runs here. Dependabot proposes the updates.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Unit tests (crypto vectors, eco rules)
        run: ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee build-output.txt; exit ${PIPESTATUS[0]}

      - name: Check amend TURN service
        continue-on-error: true
        run: |
          code=$(curl -s -o ice.json -w "%{http_code}" -H "X-Amend-Key: amend-calls-v1" https://amend-turn.lordbfa.workers.dev/ice)
          n=$(grep -o '"turns\?:[^"]*"' ice.json | wc -l)
          if [ "$code" = "200" ] && [ "$n" -gt 0 ]; then
            echo "::notice title=TURN service::OK — $n Cloudflare TURN addresses with fresh credentials"
          else
            echo "::warning title=TURN service::HTTP $code — $(head -c 200 ice.json)"
          fi
          rm -f ice.json

      # The release APK is signed only with the owner's private key, stored as repository
      # secrets. Without them the release APK stays unsigned and only debug APKs (signed with
      # the public development key, as app.amend.messenger.debug) are published.
      - name: Release signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.AMEND_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "AMEND_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "::notice title=Signing::release APK signed with the private release key"
          else
            echo "::notice title=Signing::no release key configured: the release APK is unsigned"
          fi

      - name: Build APKs
        env:
          AMEND_RELEASE_STORE_PASSWORD: ${{ secrets.AMEND_RELEASE_STORE_PASSWORD }}
          AMEND_RELEASE_KEY_ALIAS: ${{ secrets.AMEND_RELEASE_KEY_ALIAS }}
          AMEND_RELEASE_KEY_PASSWORD: ${{ secrets.AMEND_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease :wear:assembleDebug :wear:assembleRelease --stacktrace 2>&1 | tee -a build-output.txt; exit ${PIPESTATUS[0]}

      # Report which bundled native libraries are not yet aligned for 16 KB memory pages
      # (Android 15+; Google Play hard-enforces this from 1 Feb 2027). Checks the p_align of
      # every LOAD segment in every 64-bit .so — 16 KB means >= 0x4000 (16384). Only arm64-v8a
      # and x86_64 matter: 16 KB pages exist only on 64-bit devices, and 32-bit libraries are
      # always 4 KB aligned. Non-blocking: it names any library still waiting on its upstream.
      - name: Check 16 KB native alignment
        continue-on-error: true
        run: |
          bad=""; ok=0
          for apk in app/build/outputs/apk/release/*.apk wear/build/outputs/apk/release/*.apk; do  # signed or unsigned
            [ -f "$apk" ] || continue
            tmp=$(mktemp -d)
            unzip -o -q "$apk" 'lib/*' -d "$tmp" 2>/dev/null || true
            while IFS= read -r so; do
              min=$(readelf -lW "$so" | awk '/LOAD/ {print strtonum($NF)}' | sort -n | head -1)
              if [ -n "$min" ] && [ "$min" -lt 16384 ]; then
                bad="$bad $(basename "$so")"
                echo "::warning title=16KB alignment::$(basename "$so") in $(basename "$apk") ($(basename "$(dirname "$so")")) is 4 KB aligned (LOAD align $min) — needs a 16 KB-aligned upstream build"
              else
                ok=$((ok+1))
              fi
            done < <(find "$tmp/lib/arm64-v8a" "$tmp/lib/x86_64" -name '*.so' 2>/dev/null)
            rm -rf "$tmp"
          done
          uniq_bad=$(echo $bad | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "::notice title=16KB alignment::$ok library file(s) already 16 KB aligned; still 4 KB:${uniq_bad:- none}"

      # Turn compiler and test errors into annotations so they're visible without opening logs
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|AssertionError|Exception" build-output.txt | head -60 | while IFS= read -r line; do
            echo "::error::${line//$'\n'/ }"
          done
          # lint "vital" findings that block a release build
          find app/build -name "lint-results-*.txt" -o -name "lint-results*.txt" 2>/dev/null | head -3 | while read -r f; do
            grep -E ": Error: " "$f" | head -20 | while IFS= read -r line; do echo "::error title=Lint::$line"; done
          done
          grep -E ": Error: " build-output.txt | head -20 | while IFS= read -r line; do echo "::error title=Lint::$line"; done

      - name: Live relay test (real network)
        continue-on-error: true
        run: |
          ./gradlew :app:testDebugUnitTest --tests "app.amend.messenger.LiveRelayTest" -Damend.liveRelays=true --rerun 2>&1 | tee relay-output.txt
          if [ -f app/build/relay-report.txt ]; then
            echo "::notice title=Relay test::$(sed -z 's/\n/%0A/g' app/build/relay-report.txt)"
          fi
          grep -E "FAILED|AssertionError" relay-output.txt | head -10 | while IFS= read -r l; do echo "::warning title=Relay test::$l"; done

      - name: Relay scan
        continue-on-error: true
        run: |
          ./gradlew :app:testDebugUnitTest --tests "app.amend.messenger.RelayScanTest" -Damend.relayScan=true --rerun 2>&1 | tail -5
          if [ -f app/build/relay-scan.txt ]; then
            echo "::notice title=Relay scan::$(sed -z 's/\n/%0A/g' app/build/relay-scan.txt)"
          fi

      - name: Blossom scan
        continue-on-error: true
        run: |
          ./gradlew :app:testDebugUnitTest --tests "app.amend.messenger.MediaTest" -Damend.blobScan=true --rerun 2>&1 | tail -5
          if [ -f app/build/blob-scan.txt ]; then
            echo "::notice title=Blossom scan::$(sed -z 's/\n/%0A/g' app/build/blob-scan.txt)"
          fi

      - name: Build Play Store bundle (unsigned)
        run: ./gradlew :app:bundleRelease :wear:bundleRelease -Pamend.unsigned=true --stacktrace 2>&1 | tail -20; exit ${PIPESTATUS[0]}

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/bundle/release/*.aab out/amend-release-unsigned.aab
          cp wear/build/outputs/bundle/release/*.aab out/amend-wear-release-unsigned.aab
          cp wear/build/outputs/apk/debug/*.apk out/amend-wear-debug.apk
          cp app/build/outputs/apk/debug/*.apk out/amend-debug.apk
          # release APKs only when signed with the private key (an unsigned APK can't be installed)
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then cp app/build/outputs/apk/release/app-release.apk out/amend-release.apk; fi
          if [ -f wear/build/outputs/apk/release/wear-release.apk ]; then cp wear/build/outputs/apk/release/wear-release.apk out/amend-wear-release.apk; fi
          ls -la out

      # Artifacts count against the account's storage quota: keep them a week, and a full
      # quota (it frees up within 6-12 h) must not turn a good build red.
      # A tagged release needs the artifact (the release job attaches it), so there it must succeed.
      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: amend-apk
          retention-days: 7
          path: |
            out/*.apk
            out/*.aab

  # The only job with write access: it runs no build tools and no project code, it just
  # attaches the files the build job made to the release for this tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: amend-apk
          path: out

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/*.apk
