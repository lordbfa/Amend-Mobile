<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1060" width="1500" height="1060" font-family="Helvetica, Arial, sans-serif"><rect width="1500" height="1060" fill="#FBFDFB"/><text x="40" y="56" font-size="28" font-weight="700" fill="#0F3D2B">amend — geometric construction</text><text x="40" y="86" font-size="15" fill="#4A6356">Every measure comes from one unit circle and the golden ratio φ = (1+√5)/2 ≈ 1.618</text><g transform="translate(300,370) scale(62)"><path d="M2.6180,0.0000 A2.6180,2.6180 0 0 0 -0.3090,-0.9511 A1,1 0 0 0 -0.9511,-0.3090 Q-1.0438,-0.0237 -1.7200,0.3400 Q-1.0623,-0.0333 -0.9511,0.3090 A1,1 0 0 0 -0.3090,0.9511 A2.6180,2.6180 0 0 0 2.6180,0.0000 Z" fill="#2BB673" fill-opacity="0.16" stroke="#178A52" stroke-width="0.025"/><circle cx="0" cy="0" r="1" fill="none" stroke="#E65100" stroke-width="0.012" stroke-dasharray="0.05 0.04"/><circle cx="0" cy="0" r="0.035" fill="#E65100"/><circle cx="0.5" cy="1.5388" r="2.618033988749895" fill="none" stroke="#1565C0" stroke-width="0.012" stroke-dasharray="0.05 0.04"/><circle cx="0.5" cy="1.5388" r="0.035" fill="#1565C0"/><circle cx="0.5" cy="-1.5388" r="2.618033988749895" fill="none" stroke="#1565C0" stroke-width="0.012" stroke-dasharray="0.05 0.04"/><circle cx="0.5" cy="-1.5388" r="0.035" fill="#1565C0"/><line x1="-2.2" y1="0" x2="3.1" y2="0" stroke="#8A9A90" stroke-width="0.01"/><line x1="0" y1="0" x2="-0.30901699437494734" y2="-0.9510565162951536" stroke="#E65100" stroke-width="0.012"/><circle cx="-0.30901699437494734" cy="-0.9510565162951536" r="0.04" fill="#E65100"/><line x1="0" y1="0" x2="-0.30901699437494756" y2="0.9510565162951535" stroke="#E65100" stroke-width="0.012"/><circle cx="-0.30901699437494756" cy="0.9510565162951535" r="0.04" fill="#E65100"/><circle cx="-0.9510565162951535" cy="-0.3090169943749475" r="0.035" fill="#6A1B9A"/><circle cx="-0.9510565162951536" cy="0.3090169943749473" r="0.035" fill="#6A1B9A"/><circle cx="2.618033988749895" cy="0" r="0.045" fill="#0F3D2B"/><circle cx="-1.72" cy="0.34" r="0.045" fill="#0F3D2B"/><line x1="0" y1="1.95" x2="2.618033988749895" y2="1.95" stroke="#0F3D2B" stroke-width="0.012"/><line x1="0" y1="1.88" x2="0" y2="2.02" stroke="#0F3D2B" stroke-width="0.012"/><line x1="2.618033988749895" y1="1.88" x2="2.618033988749895" y2="2.02" stroke="#0F3D2B" stroke-width="0.012"/></g><text x="351.1590536512467" y="512.9" font-size="15" fill="#0F3D2B">φ² = 2.618</text><text x="286" y="388" font-size="15" fill="#E65100">O</text><text x="472.31810730249344" y="375" font-size="15" fill="#0F3D2B">tip</text><text x="133.36" y="421.08" font-size="15" fill="#0F3D2B">tail / stem</text><circle cx="620" cy="190" r="7" fill="#E65100"/><text x="638" y="196" font-size="16" fill="#24372C">Body: unit circle (r = 1) — the speech bubble.</text><circle cx="620" cy="230" r="7" fill="#1565C0"/><text x="638" y="236" font-size="16" fill="#24372C">Leaf edges: two arcs of radius φ² = 2.618, internally tangent to the body.</text><circle cx="620" cy="270" r="7" fill="#E65100"/><text x="638" y="276" font-size="16" fill="#24372C">They touch the body at 108° and 252° — pentagon angles (cos 108° = −1 / 2φ).</text><circle cx="620" cy="310" r="7" fill="#0F3D2B"/><text x="638" y="316" font-size="16" fill="#24372C">Tip at φ² from the centre; leaf length : width = (φ² + 1) : 2 = 1.809.</text><circle cx="620" cy="350" r="7" fill="#6A1B9A"/><text x="638" y="356" font-size="16" fill="#24372C">Tail leaves the body at 180° ± 18° (half a pentagon angle) — the bubble's tail is the leaf's stem.</text><circle cx="620" cy="390" r="7" fill="#0F3D2B"/><text x="638" y="396" font-size="16" fill="#24372C">A seam along the midrib splits the leaf in two: two people in one conversation, and a mend.</text><circle cx="620" cy="430" r="7" fill="#0F3D2B"/><text x="638" y="436" font-size="16" fill="#24372C">Mark is set at −45°, rising to the upper right: growth.</text><text x="40" y="740" font-size="18" font-weight="700" fill="#0F3D2B">Wordmark — monoline, built from one circle</text><g transform="translate(60,800) scale(0.9)"><line x1="-20" y1="0" x2="900" y2="0" stroke="#C9D6CE" stroke-width="1.5"/><line x1="-20" y1="100" x2="900" y2="100" stroke="#C9D6CE" stroke-width="1.5"/><line x1="-20" y1="-61.8" x2="900" y2="-61.8" stroke="#C9D6CE" stroke-width="1.5" stroke-dasharray="6 6"/><g transform="translate(0,0) scale(1.0)"><path d="M50,8 A42,42 0 1 0 50.01,8 M92,8 V100" transform="translate(0,0)" fill="none" stroke="#0F3D2B" stroke-width="16" stroke-linecap="butt"/><path d="M8,100 V38 A30,30 0 0 1 68,38 V100 M68,38 A30,30 0 0 1 128,38 V100" transform="translate(125.88854381999832,0)" fill="none" stroke="#0F3D2B" stroke-width="16" stroke-linecap="butt"/><path d="M10,50 H92 A42,42 0 1 0 82.2,77.0" transform="translate(287.77708763999664,0)" fill="none" stroke="#0F3D2B" stroke-width="16" stroke-linecap="butt"/><path d="M8,100 V50 A42,42 0 0 1 92,50 V100" transform="translate(413.665631459995,0)" fill="none" stroke="#0F3D2B" stroke-width="16" stroke-linecap="butt"/><path d="M50,8 A42,42 0 1 0 50.01,8 M92,-61.8 V100" transform="translate(539.5541752799933,0)" fill="none" stroke="#0F3D2B" stroke-width="16" stroke-linecap="butt"/></g></g><text x="40" y="1000" font-size="15" fill="#4A6356">x-height 100 · stroke 16 · bowls are circles r = 42 · ascender = x-height × φ = 161.8 · letter gap = stroke × φ = 25.9</text><text x="40" y="1024" font-size="15" fill="#4A6356">Colours: leaf #7BF0B0 → #4FD98C (upper), #2BB673 → #178A52 (lower), forest #0F3D2B → #05150F</text></svg>